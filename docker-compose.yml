# Used by ./launch in docker mode. All settings live in .env.

services:

  dukpearl:
    build: .
    image: dukpearl:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Microsoft login tokens — kept so you only sign in once
      - minecraft:/root/.minecraft
      # Module settings; edit config.yml and run `docker compose restart dukpearl`
      - ./config.yml:/app/config.yml
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-25577}:25577"
    environment:
      - DATABASE_URL=postgresql://dukpearl:dukpearl@postgres:5432/dukpearl
      - MC_PROFILE=/root/.minecraft
      - MC_VERSION=${MC_VERSION:-1.20.1}
      - PROXY_PORT=25577
      - REDIS_URL=redis://redis:6379
    env_file:
      - path: .env
        required: true

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: dukpearl
      POSTGRES_PASSWORD: dukpearl
      POSTGRES_DB: dukpearl
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dukpearl" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  minecraft:
  pgdata:
